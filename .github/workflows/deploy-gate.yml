name: Deployment Gate (PR Checks)

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  validate-gate:
    name: Verify Code and Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Copy Env File
        run: cp .env.example .env

      - name: Run Complete Test Suite
        run: npx playwright test --project=api --project=chromium
        env:
          APP_BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8080
          ENVIRONMENT: qa
          TEST_USER_EMAIL: qa@platione.com
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'QA_PR_Gate_Test_Password' }}

      - name: Upload PR Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pr-report
          path: reports/
          retention-days: 7
