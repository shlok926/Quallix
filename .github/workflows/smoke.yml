name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Copy Env File
        run: cp .env.example .env

      - name: Run Smoke Tests
        run: npx playwright test --grep "@smoke" --project=api --project=chromium
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'http://localhost:4200' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:8080' }}
          ENVIRONMENT: qa
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'qa@platione.com' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'QA_Smoke_Test_Password' }}

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: reports/
          retention-days: 14
